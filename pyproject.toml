[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lstar"
version = "0.8.0"
description = "LLM-guided spatial domain detection, consensus clustering, and biological domain annotation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "L-STAR Contributors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "openai>=1.0.0",
    "tqdm>=4.60.0",
    "matplotlib>=3.5.0",
    "anndata>=0.10.0",
    "scanpy>=1.10.0",
    "h5py>=3.7.0",
    "jsonschema>=4.0.0",
    "Pillow>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "mypy>=0.950",
]

[project.urls]
Homepage = "https://github.com/Williamzcy0929/L-STAR"
Documentation = "https://github.com/Williamzcy0929/L-STAR"
Repository = "https://github.com/Williamzcy0929/L-STAR"

[tool.setuptools.packages.find]
where = ["."]
include = ["lstar*"]

[tool.setuptools.package-data]
lstar = ["resources/*.R"]
"lstar.domain_annotation" = [
    "skills/domain_annotation/*",
    "skills/feature_resolution/*",
]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
