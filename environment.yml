name: lstar
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python>=3.10
  - r-base=4.3.0
  - r-remotes
  - r-devtools
  - r-rcolorbrewer
  - r-ggplot2
  - pandas>=1.3.0
  - numpy>=1.20.0
  - scipy>=1.7.0
  - scikit-learn>=1.0.0
  - matplotlib>=3.5.0
  - anndata>=0.10.0
  - scanpy>=1.10.0
  - h5py>=3.7.0
  - jsonschema>=4.0.0
  - pillow>=9.0.0
  - pip
  - pip:
    - openai>=1.0.0
    - tqdm>=4.60.0

# Post-install: Install Palo R package
# Run: conda env create -f environment.yml
# Then: conda activate lstar && R -e "remotes::install_github('Winnie09/Palo')"
